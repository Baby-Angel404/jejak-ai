name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          # Pemeriksaan secret membaca riwayat penuh, bukan hanya commit terakhir.
          fetch-depth: 0

      # Rahasia tidak boleh masuk commit. Pakai CLI gitleaks versi yang dikunci
      # beserta checksumnya, bukan aksi pihak ketiga: perilakunya bisa diuji
      # persis sama secara lokal sebelum commit ini masuk.
      - name: Pantau kebocoran secret (gitleaks)
        run: |
          set -euo pipefail
          GL_VERSION=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}"
          # Nama berkas harus sama dengan yang tertulis di checksums, karena
          # `sha256sum -c` mencarinya di direktori kerja.
          tarball="gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${base}/${tarball}" -o "/tmp/${tarball}"
          curl -sSfL "${base}/gitleaks_${GL_VERSION}_checksums.txt" -o /tmp/checksums.txt
          ( cd /tmp && grep "$tarball" checksums.txt | sha256sum -c - )
          tar -xzf "/tmp/${tarball}" -C /tmp gitleaks
          /tmp/gitleaks detect --source=. --redact --no-banner

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # better-sqlite3 butuh toolchain build kalau tidak ada prebuilt untuk platform ini.
      - name: Siapkan toolchain untuk better-sqlite3
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++

      - run: npm ci

      - name: Siapkan berkas .env dari contoh
        run: npm run setup

      - name: Pasang browser untuk E2E
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Tes unit server (kalkulator, adapter, route, keamanan)
        run: npm test

      - name: Tes unit client (store, agregasi, engine adegan)
        run: npm --workspace client run test

      - name: Audit dependensi
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: E2E (build produksi dilayani Express)
        run: npm run test:e2e

      - name: Lampirkan laporan E2E saat gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
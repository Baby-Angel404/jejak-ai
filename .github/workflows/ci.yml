name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # better-sqlite3 butuh toolchain build kalau tidak ada prebuilt untuk platform ini.
      - name: Siapkan toolchain untuk better-sqlite3
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++

      - run: npm ci

      - name: Siapkan berkas .env dari contoh
        run: npm run setup

      - name: Pasang browser untuk E2E
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Tes unit server (kalkulator, adapter, route, keamanan)
        run: npm test

      - name: Tes unit client (store, agregasi, engine adegan)
        run: npm --workspace client run test

      - name: Build
        run: npm run build

      - name: E2E (build produksi dilayani Express)
        run: npm run test:e2e

      - name: Lampirkan laporan E2E saat gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
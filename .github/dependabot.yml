version: 2

# Dependensi dipantau otomatis: advisory keamanan memicu PR, bukan dibiarkan
# membusuk diam-diam. Audit juga berjalan di CI sebagai gerbang.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      server:
        patterns:
          - 'express'
          - 'better-sqlite3'
          - 'cors'
          - 'dotenv'
      toolchain:
        patterns:
          - 'vite'
          - 'vitest'
          - '@playwright/test'
          - 'typescript'
      frontend:
        patterns:
          - 'react'
          - 'react-dom'
          - 'recharts'
          - '@vitejs/plugin-react'
    # Lonjakan mayor ditolak otomatis. Alasannya diuji di mesin ini, bukan tebakan:
    #   express 4->5                     -> sudah dimigrasi (lihat riwayat git)
    #   better-sqlite3 11->13            -> mensyaratkan Node >= 22; di Node 20
    #                                       binary prebuilt segfault saat DB dibuka
    #   typescript 7, vitest 5 -> sudah dimigrasi (lihat riwayat git)
    #   vite 6->8 -> DITAHAN: bundler rolldown butuh binding native yang tidak
    #                  dipasang npm ci di Linux, jadi build rusak di mesin lain
    #   (seluruh muatanMayor sudah dimigrasi: lihat riwayat git)
    #   react 18->19, recharts 2->3            -> build dan tes client gagal
    # Upgrade mayor adalah pekerjaan migrasi tersendiri, bukan-PR otomatis.
    # Kalau salah satu sudah selesai di tangan, hapus baris ignore-nya.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Lonjakan mayor actions (v4 -> v7) dihentikan agar datangnya satu per satu;
      # PR-nya sendiri sudah diuji dan hijau, jadi bisa levantamento manual.
      - dependency-name: 'actions/checkout'
        update-types: ['version-update:semver-major']
      - dependency-name: 'actions/setup-node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'actions/upload-artifact'
        update-types: ['version-update:semver-major']
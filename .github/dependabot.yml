version: 2

# Dependensi dipantau otomatis: advisory keamanan memicu PR, bukan dibiarkan
# membusuk diam-diam. Audit juga berjalan di CI sebagai gerbang.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      server:
        patterns:
          - 'express'
          - 'better-sqlite3'
          - 'cors'
          - 'dotenv'
      toolchain:
        patterns:
          - 'vite'
          - 'vitest'
          - '@playwright/test'
          - 'typescript'
      frontend:
        patterns:
          - 'react'
          - 'react-dom'
          - 'recharts'
          - '@vitejs/plugin-react'
    # Lonjakan mayor ditolak otomatis. Yang TIDAK diabaikan tetap naik
    # (minor/patch), dan advisory keamanan tetap membuka PR seperti biasa.
    #
    # Status per muatan mayor, semuanya sudah diuji di mesin ini:
    #   express 4->5                -> SUDAH dimigrasi
    #   dotenv 16->18               -> SUDAH dimigrasi
    #   typescript 5->7, vitest 4->5-> SUDAH dimigrasi (TS7 butuh deklarasi
    #                                   import CSS di client/src/vite-env.d.ts)
    #   react 18->19, recharts 2->3 -> SUDAH dimigrasi (helper tooltipFormatter)
    #
    # Yang masih ditahan, dengan alasan terukur:
    #   better-sqlite3 11->13 -> mensyaratkan Node >= 22; binary prebuilt segfault
    #                            saat database dibuka di Node 20 (direproduksi lokal)
    #   vite 6->8            -> Vite 8 memakai bundler rolldown yang butuh binding
    #                            native, dan `npm ci` di Linux tidak memasangnya, jadi
    #                            build rusak di mesin lain dan di CI
    #   @vitejs/plugin-react 4->6 -> mensyaratkan Vite 8, jadi terikat pada vite di atas
    #
    # Saat salah satu naik, hapus baris "DITAHAN" di atas. Alasan lengkap
    # ada di bagian tabel versi README, supaya hanya ada satu sumber kebenaran.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Lonjakan mayor actions ditahan agar datangnya satu per satu, bukan lima
      # sekaligus. PR-nya sendiri sudah pernah diuji lokal dan hijau, jadi siap
      # di-merge manual kapan diinginkan.
      - dependency-name: 'actions/checkout'
        update-types: ['version-update:semver-major']
      - dependency-name: 'actions/setup-node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'actions/upload-artifact'
        update-types: ['version-update:semver-major']